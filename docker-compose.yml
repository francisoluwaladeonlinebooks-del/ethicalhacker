# FICAP — single-container demonstration deployment.
#
# Demo mode is the default: synthetic data only, labelled throughout the UI.
# Set FICAP_MODE=live and provide real key material for anything else, and
# replace the embedded database before holding real supervisory data.
services:
  ficap:
    build: .
    image: ficap:local
    environment:
      FICAP_MODE: ${FICAP_MODE:-demo}
      FICAP_DATA_DIR: /data/pglite
      FICAP_ENCRYPTION_KEY: ${FICAP_ENCRYPTION_KEY:-}
      FICAP_SESSION_PEPPER: ${FICAP_SESSION_PEPPER:-}
      FICAP_BASE_URL: ${FICAP_BASE_URL:-http://localhost:3000}
      FICAP_WORKER_ENABLED: ${FICAP_WORKER_ENABLED:-true}
    ports:
      - "3000:3000"
    volumes:
      - ficap-data:/data
    # The assessment engine must reach only allowlisted targets; the default
    # network is kept internal to the compose project on purpose.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  ficap-data:
